<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicons/favicon.ico">
    <title>Create Account | Student Hustle Hub</title>
    <meta name="description" content="Join Student Hustle Hub free — create a student account to offer tutoring, design, programming, and other campus services or find trusted student providers in Kenya.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0F766E">
    <link rel="canonical" href="https://student-hustle-hub.vercel.app/register.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Student Hustle Hub">
    <meta property="og:locale" content="en_KE">
    <meta property="og:title" content="Create Account | Student Hustle Hub">
    <meta property="og:description" content="Join Student Hustle Hub free — create a student account to offer or find campus services in Kenya.">
    <meta property="og:url" content="https://student-hustle-hub.vercel.app/register.html">
    <meta property="og:image" content="https://student-hustle-hub.vercel.app/assets/favicons/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Create Account | Student Hustle Hub">
    <meta name="twitter:description" content="Join Student Hustle Hub free — create a student account to offer or find campus services.">
    <meta name="twitter:image" content="https://student-hustle-hub.vercel.app/assets/favicons/favicon.ico">
    <meta name="api-base-url" content="http://localhost:5000/api">
    <!-- Sentry Loader Script (first script to buffer early errors) -->
    <script src="https://js.sentry-cdn.com/71c78d8a966b6cc539096db5c6ed2154.min.js" crossorigin="anonymous"></script>
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme');
                const theme = savedTheme === 'dark' || savedTheme === 'light'
                    ? savedTheme
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', theme === 'dark');
            } catch (error) {}
        })();
    </script>
    <link rel="stylesheet" href="app.css">
    <script src="vendor/tailwind.js"></script>
    <script defer src="vendor/lucide.js"></script>
    <script defer src="config.js"></script>
    <script defer src="app.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F766E',
                        secondary: '#F59E0B',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen antialiased text-slate-900 dark:text-slate-100">
    <div class="app-bg"></div>
    <header id="app-navbar"></header>

    <main class="mx-auto flex max-w-7xl items-center justify-center px-4 py-12">
        <section class="w-full max-w-md glass rounded-2xl p-6 shadow-sm sm:p-8">
            <div class="flex items-start gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 text-primary ring-1 ring-primary/20 dark:bg-primary/20 dark:ring-primary/30">
                    <i data-lucide="user-plus" class="h-5 w-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Create your account</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Start posting services and get discovered on campus.</p>
                </div>
            </div>

            <form id="register-form" class="mt-6 space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Full name</label>
                    <input type="text" id="name" autocomplete="name" required class="mt-1 w-full rounded-xl border border-slate-200/70 bg-white/80 px-3 py-3 text-sm text-slate-900 shadow-sm outline-none ring-primary/30 placeholder:text-slate-400 focus:border-primary/60 focus:ring-4 dark:border-slate-700/60 dark:bg-slate-950/50 dark:text-white dark:placeholder:text-slate-400" placeholder="Jane Doe">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Email</label>
                    <input type="email" id="email" autocomplete="email" required class="mt-1 w-full rounded-xl border border-slate-200/70 bg-white/80 px-3 py-3 text-sm text-slate-900 shadow-sm outline-none ring-primary/30 placeholder:text-slate-400 focus:border-primary/60 focus:ring-4 dark:border-slate-700/60 dark:bg-slate-950/50 dark:text-white dark:placeholder:text-slate-400" placeholder="you@university.edu">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Password</label>
                    <input type="password" id="password" autocomplete="new-password" required class="mt-1 w-full rounded-xl border border-slate-200/70 bg-white/80 px-3 py-3 text-sm text-slate-900 shadow-sm outline-none ring-primary/30 placeholder:text-slate-400 focus:border-primary/60 focus:ring-4 dark:border-slate-700/60 dark:bg-slate-950/50 dark:text-white dark:placeholder:text-slate-400" placeholder="••••••••">
                    <div id="password-strength" class="mt-2 hidden">
                        <div class="flex gap-1">
                            <div id="ps-bar-1" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-colors"></div>
                            <div id="ps-bar-2" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-colors"></div>
                            <div id="ps-bar-3" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-colors"></div>
                            <div id="ps-bar-4" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-colors"></div>
                        </div>
                        <p id="ps-label" class="mt-1 text-xs text-slate-500 dark:text-slate-400"></p>
                    </div>
                </div>
                <div>
                    <label for="university" class="block text-sm font-medium text-slate-700 dark:text-slate-200">University</label>
                    <input type="text" id="university" required class="mt-1 w-full rounded-xl border border-slate-200/70 bg-white/80 px-3 py-3 text-sm text-slate-900 shadow-sm outline-none ring-primary/30 placeholder:text-slate-400 focus:border-primary/60 focus:ring-4 dark:border-slate-700/60 dark:bg-slate-950/50 dark:text-white dark:placeholder:text-slate-400" placeholder="Campus University">
                </div>
                <div>
                    <label for="course" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Course</label>
                    <input type="text" id="course" required class="mt-1 w-full rounded-xl border border-slate-200/70 bg-white/80 px-3 py-3 text-sm text-slate-900 shadow-sm outline-none ring-primary/30 placeholder:text-slate-400 focus:border-primary/60 focus:ring-4 dark:border-slate-700/60 dark:bg-slate-950/50 dark:text-white dark:placeholder:text-slate-400" placeholder="Computer Science">
                </div>

                <div id="form-error" class="hidden rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-200"></div>

                <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 text-sm font-medium text-white shadow-sm transition hover:brightness-95">
                    <i data-lucide="sparkles" class="h-4 w-4"></i>
                    Create account
                </button>
            </form>

            <div class="mt-5 flex items-center justify-between text-sm">
                <a href="login.html" class="font-medium text-primary hover:underline">Already have an account?</a>
                <a href="index.html" class="text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white">Back to browse</a>
            </div>

            <p id="auth-mode-note" class="mt-6 text-xs text-slate-500 dark:text-slate-400">
                Connecting to server...
            </p>
        </section>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            const errorEl = document.getElementById('form-error');
            const modeNoteEl = document.getElementById('auth-mode-note');
            const isApiMode = window.SHHub?.isApiMode?.() === true;
            if (modeNoteEl && isApiMode) {
                modeNoteEl.innerText = '';
            }

            // Password strength indicator
            const passwordInput = document.getElementById('password');
            const psContainer = document.getElementById('password-strength');
            const psBars = [1, 2, 3, 4].map((i) => document.getElementById('ps-bar-' + i));
            const psLabel = document.getElementById('ps-label');

            const getPasswordStrength = (pw) => {
                let score = 0;
                if (pw.length >= 8) score += 1;
                if (pw.length >= 12) score += 1;
                if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score += 1;
                if (/\d/.test(pw) && /[^a-zA-Z0-9]/.test(pw)) score += 1;
                return Math.min(score, 4);
            };

            const strengthConfig = [
                { label: 'Too short', color: 'bg-rose-500', threshold: 0 },
                { label: 'Weak', color: 'bg-orange-500', threshold: 1 },
                { label: 'Fair', color: 'bg-amber-500', threshold: 2 },
                { label: 'Good', color: 'bg-lime-500', threshold: 3 },
                { label: 'Strong', color: 'bg-emerald-500', threshold: 4 },
            ];

            passwordInput?.addEventListener('input', () => {
                const pw = passwordInput.value;
                if (!pw) {
                    psContainer.classList.add('hidden');
                    return;
                }
                psContainer.classList.remove('hidden');
                const score = getPasswordStrength(pw);
                const config = strengthConfig[score];
                psBars.forEach((bar, i) => {
                    if (bar) {
                        bar.className = `h-1 flex-1 rounded-full transition-colors ${i < score ? config.color : 'bg-slate-200 dark:bg-slate-700'}`;
                    }
                });
                if (psLabel) psLabel.textContent = config.label;
            });

            const showError = (message) => {
                errorEl.innerText = message;
                errorEl.classList.remove('hidden');
            };

            const isNetworkError = (error) => {
                const message = String(error?.message ?? '').toLowerCase();
                return message.includes('failed to fetch')
                    || message.includes('networkerror')
                    || message.includes('network request failed')
                    || message.includes('request timeout')
                    || message.includes('aborterror');
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.classList.add('hidden');

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const university = document.getElementById('university').value.trim();
                const course = document.getElementById('course').value.trim();

                if (!name) return showError('Please enter your name.');
                if (!email) return showError('Please enter your email.');
                if (!password || password.length < 8) return showError('Password must be 8 or more characters.');
                if (!university) return showError('Please enter your university.');
                if (!course) return showError('Please enter your course.');

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalHtml = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span> Creating account...';

                try {
                    if (isApiMode && window.SHHub?.apiRegister) {
                        await window.SHHub.apiRegister({
                            name,
                            email,
                            password,
                            university,
                            course,
                        });
                    } else {
                        throw new Error('Cannot register: API connection not configured.');
                    }

                    window.location.href = 'dashboard.html';
                } catch (error) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHtml;
                    showError(error?.message || 'Registration failed.');
                }
            });
        });
    </script>
</body>
</html>
