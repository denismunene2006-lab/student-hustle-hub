<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Briefcase (opportunities) -->
  <g transform="translate(120, 100)">
    <rect x="20" y="60" width="180" height="140" rx="16" fill="white" opacity="0.95"/>
    <rect x="60" y="40" width="100" height="30" rx="10" fill="white" opacity="0.95"/>
    <rect x="20" y="60" width="180" height="140" rx="16" stroke="#0F766E" stroke-width="6" fill="none"/>
    <rect x="60" y="40" width="100" height="30" rx="10" stroke="#0F766E" stroke-width="6" fill="none"/>
  </g>
  <!-- Graduation cap (students) -->
  <g transform="translate(32, 280)">
    <path d="M0 40 L40 0 L80 40 L40 80 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M30 50 L30 80 L50 80 L50 50" fill="#F59E0B" opacity="0.7"/>
    <rect x="10" y="35" rx="4" ry="4" width="60" height="8" fill="#D97706"/>
  </g>
  <!-- Handshake (services/trust) -->
  <g transform="translate(290, 280)">
    <path d="M20 60 Q40 20 80 40 Q100 50 90 70 Q70 90 40 80 Z" fill="white" opacity="0.9"/>
    <path d="M10 40 Q30 20 60 30 Q80 40 70 60 Q50 70 30 60 Z" fill="white" opacity="0.7"/>
    <path d="M20 60 Q40 20 80 40 Q100 50 90 70 Q70 90 40 80 Z" stroke="#0F766E" stroke-width="3" fill="none"/>
  </g>
  <!-- Star (quality/excellence) -->
  <g transform="translate(400, 100)">
    <polygon points="40,0 52,28 80,32 58,52 64,80 40,64 16,80 22,52 0,32 28,28" fill="#F59E0B" opacity="0.95"/>
  </g>
</svg>